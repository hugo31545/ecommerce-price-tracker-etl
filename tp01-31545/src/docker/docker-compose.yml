name: docker
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: precos
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]

  sftp:
    image: atmoz/sftp
    ports: ["2222:22"]
    command: etl:etl:::upload

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata: